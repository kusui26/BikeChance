[project]
name = "bikechance-ml"
version = "0.0.0"
description = "BikeChance の ML サービス（FastAPI）。W2 は疎通だけ。"
requires-python = ">=3.12"

# **本番の依存はここだけ。** 増やすたびに Vercel の関数の大きさに効くので、
# 実測してから足す（2026-09-08 の実測：fastapi 26 MB、＋httpx 28 MB、＋pyarrow 154 MB。
# Linux のホイールは pyarrow が 48 MB 圧縮）。
#
# **上限は 500 MB である**（Vercel の Python ランタイム。Node の関数は 250 MB）。
# 2026-09-10 までこの注記は「250 MB」と書いていたが、それは Node 側の数字だった
# （開発プラン §4.5 は最初から「バンドル 250 MB（Python 500 MB）」と正しく書いている）。
# **上限を 2 倍間違えていた。** W4 プラン §12 の 123。
#
# **polars ではなく pyarrow を選んだ**のは実測で小さかったから（polars 211 MB /
# pyarrow 139 MB）。CLAUDE.md §3 はどちらも認めている。
#
# **psycopg を入れない。** Postgres は PostgREST 越しに読む。1 時間ぶんは 57 行しか
# 無く、JSON の上乗せは 5 MB 程度で済む。直接接続を足すと経路が 2 本になり、
# 依存も 30 MB 増える（W2 プラン §12 の 57）。
# **numpy は W3 の段 8 で本番依存に上げた**（W3-20 が「段 8 でサイズを実測してから
# 判断する」としていた）。実測：fastapi + httpx + pyarrow で 133 MB、numpy を足して
# 155 MB（＋22 MB、＋17%）。**この 155 MB は 2026-09-08 の値で、いまは 212 MB である**
# （pyarrow 20 → 25、numpy 2.2 → 2.5。版の範囲を開けてあるので、足さなくても増える）。
# **上げた理由は大きさではなく、実装を 1 つに保つため**：`/ml/infer` は
# `baselines/` の当てはめ結果をそのまま使う。配信用に別の実装を書けば、
# 学習と配信で答えがずれる（CLAUDE.md §2 の原則 4）。
# **lightgbm は本番依存ではない**（W4-19。PR E の W4-15 を取り消した）。**大きさの
# 問題ではなく、動かないからである**：ホイールの `lib_lightgbm.so` は OpenMP
# （`libgomp.so.1`）を必要とするのに同梱しておらず、Vercel の Python ランタイム
# （Amazon Linux）にそれが無い。`import lightgbm` が `OSError` で落ちる
# （2026-09-10 に本番で発生。Docker で再現。W4 プラン §12 の 126）。
# **ビルドは通る**（読み込みは実行時なので、大きさの検査では捕まらない）。
# 配信は `models/forest.py` が木を numpy で歩く。**同じ値が出ることは、当てはめた
# 直後に `Booster.predict` と突き合わせて確かめる**（`jobs/fit_lightgbm.py`）。
#
# 実測（2026-09-10、manylinux_2_28_x86_64 / cp312 の展開後）：
#   本番           212 MB（pyarrow 152・numpy 57）
#   ＋ lightgbm    334 MB（lightgbm 10・scipy 110・narwhals 3）── 入れない
#   上限           500 MB
# **scipy は lightgbm の必須依存**である（4.x は `basic.py` が無条件に import する）。
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "numpy>=2.1,<3",
  "pyarrow>=18,<26",
]

# **当てはめる側だけが lightgbm を要る。** 週次再学習（GitHub Actions）とローカルで
# 使い、Vercel には入らない。
[project.optional-dependencies]
dev = ["ruff>=0.9", "mypy>=1.14", "pytest>=8.3", "lightgbm>=4.5,<5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bikechance_ml"]

# ── ruff ─────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# CLAUDE.md §3 の規約に対応するものを選ぶ。
#   E,W,F  基本    I  import 順    N  命名    UP  新しい書き方
#   B      バグの温床    A  組み込み名の影         C4  内包表記
#   SIM    冗長な分岐    RET 早期 return         ARG 未使用引数
#   PTH    os.path より pathlib   RUF  ruff 固有
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ARG", "PTH", "RUF"]

# このリポジトリのコメントと docstring は日本語で書く（CLAUDE.md の方針）。
# RUF002 / RUF003 は「ASCII に似た全角文字」を疑うルールで、日本語の約物は
# すべて引っかかる。**ルールごと切らずに、実際に使う約物だけを許可する。**
# 表意文字空白（U+3000）はここに入れない。目に見えない空白は本当に事故のもとで、
# 検出され続けてほしい。
# 「′」は PR の名前（PR E′）に使う。バッククォートと紛れる形だが、文章の中でだけ現れる。
allowed-confusables = [
  "（", "）", "：", "、", "。", "！", "？", "〜", "・", "×", "＝", "−", "′",
]

[tool.ruff.lint.per-file-ignores]
# テストの代役（`FakePort` 等）は本物と**同じ引数**を取らなければ Protocol を満たせず、
# 使わない引数が必ず残る。代役の署名を歪めるほうが害が大きいので、ここだけ許す。
"tests/*" = ["ARG001", "ARG002", "ARG005"]

# ── mypy ─────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
# CLAUDE.md §3「any 禁止」を機械で守る
disallow_any_explicit = true
warn_unreachable = true
files = ["bikechance_ml", "tests", "main.py"]

# pyarrow は型情報（py.typed）を配布していない（実測：25.0.1 に py.typed も .pyi も無い）。
# 第三者のスタブ（pyarrow-stubs）は依存を 1 つ増やすので入れず、**この 1 モジュールに
# 限って**未解決の import を許す。境界の型はこちら側で持つ（`SCHEMA` が列と型の契約、
# `Snapshot` / `StationRow` が入力の型）ので、失われるのは pyarrow の内部だけ。
[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

# ── pytest ───────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
