name: 当てはめの山を測る

# **`ubuntu-latest` で当てはめて、常駐の高水位を測る**（W5 プラン §12 の 168 の検算）。
#
# **なぜ要るか。** 「28 日ぶんは 14.2 GiB」は**手元 macOS（8 GB、スワップしながら）の
# 2 点から 5.6 倍に外挿**した数で、**週次の再学習が載る機械では一度も測っていない**。
# `ubuntu-latest`（公開リポジトリは 4 vCPU / 16 GB）に対して余裕は 1.8 GiB しかない
# 見込みで、**PR J（`prof_*`、`FEATURE_SET` v4）が列を 62 → 66〜69 に増やすと消える**。
# 測る場所を作らないまま 2 段目（日ごとの流し込み）を作っても、**効いたことを
# 確かめる手段が無い**。
#
# **28 日ぶんの規模は、今日そのまま実データで測れる。** 学習サンプルは 09-15 までが
# 層化（約 207 万行/日）、09-16 から一様（約 60.3 万行/日）で、**層化の日は 3.4 倍濃い**。
#
#   本番 v1 の的（28 日・一様）            学習 16,876,720 行 / 読む表 18,684,940 行
#   09-08〜09-18（層化 8 日 ＋ 一様 3 日）  学習 16,607,174 行 / 読む表 18,415,395 行
#                                          → 98.4% / 98.6%
#
# **日を複製する必要は無い。** 行数と列数が同じなら、山は中身に依らない
# （行列も LightGBM の `Dataset` も幅×行数で決まる）。
#
# **何も書かない。** `bikechance_ml.jobs.measure_fit` が組み立てる引数には
# `--upload` も `--register` も入らない（`tests/test_measure_fit.py` が留める）。
#
# **定時では走らせない。** 1 回 1〜数時間かかり、測りたいときにしか意味が無い。
# `push` / `pull_request` も付けない——秘密を使うワークフローだからである（D-12）。
#
# **ファイル名を変えない。** `schedule` は無いが、`workflow_dispatch` の登録も
# ファイル単位なので、改名すると過去の実行との紐づけが切れる。
on:
  workflow_dispatch:
    inputs:
      from_dates:
        description: "学習の開始日（JSON の配列）。古いほど学習日が増える"
        required: false
        type: string
        default: '["2026-09-14","2026-09-12","2026-09-10","2026-09-08"]'
      to_date:
        description: "窓の最後の日（検証の最後の日）"
        required: false
        type: string
        default: "2026-09-18"
      allow_mixed_weather:
        description: "天気の被覆が揃っていない日を混ぜる（09-07 は 0% なので要る）"
        required: false
        type: boolean
        default: false

# 読むだけ。**このジョブは GITHUB_TOKEN を 1 つも使わない。**
permissions: {}

jobs:
  measure:
    # **水準ごとに別のランナーを使う。** 1 本が 16 GB を使い切る測定なので、
    # 同じ機械に 2 本置けない。公開リポジトリは 20 本まで同時に走る。
    strategy:
      fail-fast: false # **1 本が OOM で落ちても他を殺さない**（落ちること自体が結果）
      max-parallel: 4
      matrix:
        from_date: ${{ fromJSON(inputs.from_dates) }}
    name: 学習 ${{ matrix.from_date }} から
    runs-on: ubuntu-latest
    # **6 時間がジョブの上限**（公開リポジトリ）。手元 macOS は学習 3 日で 26 分
    # かかったので、8 日（行は 9.4 倍）は数時間を見ておく。届かなければ
    # **小さい水準だけが残る**——`fail-fast: false` はそのためでもある。
    timeout-minutes: 330
    # **ここが鍵の在り処。** `training` 環境の secrets だけがこのジョブに渡る
    environment: training
    defaults:
      run:
        working-directory: apps/ml
    steps:
      - uses: actions/checkout@v7

      # python.yml と同じ組み立て。**サードパーティのアクションに依存しない**
      - name: uv を入れる
        run: pip install --upgrade uv

      - name: Python 3.12 を用意する
        run: uv python install 3.12

      # **ここは `--extra dev` が要る。** 当てはめるので lightgbm と scipy を入れる
      # （本番の依存には入れない。W4-19）
      - name: 依存を入れる（uv.lock どおり、当てはめる側も）
        run: uv sync --frozen --extra dev --python 3.12

      # **要約欄だけに書かない**（2026-09-20 に直した。W5 プラン §12 の 168）。
      # **`GITHUB_STEP_SUMMARY` は API からも HTML からも取れない**ので、そこにしか
      # 無い数字は**画面を開いた人にしか読めない**。1 回目の測定では、機械の諸元も
      # 当てはめの報告書も後から機械で拾えなかった。**記録（ログ）にも流す。**
      - name: 機械の大きさを記録する
        run: |
          {
            echo "### 機械"
            echo ''
            echo '```'
            grep -E '^(MemTotal|SwapTotal)' /proc/meminfo
            echo "nproc: $(nproc)"
            echo '```'
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      # **入力は `env:` で渡す**（`${{ }}` をスクリプトに直接埋めない）。
      #
      # **試し直さない。** `build-features.yml` は一過性の 504 に備えて 3 回試すが、
      # ここは**測定**なので、**2 回目の数は 1 回目のページキャッシュに汚される**。
      # 落ちたら落ちたことを結果として読む。
      #
      # **成果物の置き場を増やさない**（`--json` を渡さない）。要約に曲線の 24 点が
      # 載り、**記録には要約・1 分ごとの行・機械の諸元・当てはめの報告書が残る**ので、
      # `gh run view --log` で全部読める（**要約欄は API から取れない**ので、
      # 読めるものは記録にも置く）。アクションを 1 つ足して生の点を持ち出す理由はまだ無い。
      - name: 当てはめて山を測る
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FROM_DATE: ${{ matrix.from_date }}
          TO_DATE: ${{ inputs.to_date }}
          MIXED: ${{ inputs.allow_mixed_weather }}
        run: |
          args=(--from "${FROM_DATE}" --to "${TO_DATE}" --report "${RUNNER_TEMP}/fit.md")
          if [ "${MIXED}" = "true" ]; then
            args+=(--allow-mixed-weather)
          fi
          uv run python -m bikechance_ml.jobs.measure_fit "${args[@]}"

      # **当てはめの報告書も要約に畳んで載せる。** 成果物の置き場を増やさずに、
      # 「どのベースラインと比べた数字か」（§11 の気候値の作り方）まで残す。
      # 落ちた回には報告書が無いので、**在るときだけ**。
      - name: 報告書を要約に畳み、記録にも残す
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/fit.md" ]; then
            # **記録には畳まずそのまま出す**（`<details>` は画面のための飾りで、
            # ログに入れても読みにくくなるだけ）。要約には畳んで入れる
            cat "${RUNNER_TEMP}/fit.md"
            {
              echo '<details><summary>当てはめの報告書</summary>'
              echo ''
              cat "${RUNNER_TEMP}/fit.md"
              echo ''
              echo '</details>'
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo '（報告書が無い。当てはめが最後まで行かなかった）' | tee -a "${GITHUB_STEP_SUMMARY}"
          fi
