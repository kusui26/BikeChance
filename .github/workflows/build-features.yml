name: 学習サンプルとプロファイル（日次）

# 前日ぶんの**学習サンプル**（`features/date=YYYY-MM-DD/part.parquet`）と
# **ポートプロファイル**（`profiles/date=YYYY-MM-DD/`）を作って Storage に置く。
# W4 プラン §6.8 の PR J ＋ W5 プラン §6.2 の PR B。
#
# **ファイル名は `build-features.yml` のままにしてある。** GitHub は `schedule` を
# ワークフローのファイル単位で登録するので、**名前を変えると登録し直しになる**。
# 中身を足すたびに改名すると、そのたびに「定時の回が来ない」危険を引き受けることになる
# （止まっても 30 時間で `monitored_jobs` が鳴るが、鳴らせずに済むなら鳴らさない）。
# Actions の画面に出るのは上の `name:` なので、**見え方は名前を変えなくても直る**。
#
# **Vercel Cron ではなく GitHub Actions に置く**（W4-27）。実測 41〜65 秒・ピーク 1.28 GB
# で Vercel の枠（300 秒・2 GB）には収まるが、**5 分毎の推論と同じサービスに 3 分・1.3 GB の
# バッチを混ぜない**。公開リポジトリなので Actions は無制限・無料である（開発プラン D-12）。
#
# **1 日に 2 回起動する**（W6 プラン §6.3 の PR C、W6-04）。
#
#   * **06:00 JST（21:00 UTC）**：前日ぶんの学習サンプルを作り、**プロファイルがまだ無ければ**
#     作る。`LOOKAHEAD_HOURS = 3` なので前日 21:00 JST の基準時刻は当日 03:00 JST までの
#     観測を要求し、参照スナップショットは前日 05:00 JST に置かれている。**どちらも満たす
#     最も早い枠**である
#   * **00:40 JST（15:40 UTC）**：前日ぶんの**プロファイルだけ**を作る。推論は前日の版を
#     読むので（W6 の契約 32）、**朝の穴（前日の版がまだ無く、1 つ古い版で配る時間）を縮める**。
#     プロファイルに要るのは前日いっぱいの毎時 Parquet だけで、最後の 1 時間は 00:07 JST の
#     `/ml/compact` が置く。**学習サンプルは作らない**——ラベルに当日 03:00 JST までの観測が要る
#
# **2 つ目の回はプロファイルを置き直さない**（`--skip-if-exists`）。同じ中身を置き直しても
# 壊れはしないが、推論が読んでいる最中のファイルを差し替える理由が無い。置き直さない回は
# `job_runs` に何も残さない——見張り（`check_jobs_missing`）は `ok` の行が 30 時間以内に
# 来ているかだけを見るので、1 日 2 回の起動で誤って鳴ることも、黙ることも無い。
#
# **`schedule` と `workflow_dispatch` だけで起動する。** 秘密を使うワークフローに
# `push` / `pull_request` を付けない——fork からの PR に秘密が渡らない仕組みは在るが、
# **外から起動しうる経路そのものを作らない**（開発プラン D-12）。
#
# **注意**：GitHub はリポジトリが 60 日間無活動だと `schedule` を自動で止める。
# また `schedule` は遅れる——**9/13 以降、06:00 の回は毎朝 1 時間 36 分〜2 時間 45 分遅れて
# 始まっている**（W6 プランの所見 203。GitHub の文書は毎時 0 分を避けよと書くが、40 分に
# 置いた日次評価も 2 時間前後遅れている）。**00:40 の回も同じくらい遅れる**と見込み、推論は
# 前日の版が無ければ 1 つ古い版を読む（W6 の PR D）。見張りの閾値（30 時間）は遅れを見込んである。
# **後に動く手順は時刻ではなく `job_runs` の `ok` で始める**（所見 203）。
on:
  schedule:
    - cron: "0 21 * * *"
    # **この文字列は下の「学習サンプル」の `if:` と 1 文字も違えない**。違うと 00:40 の回が
    # 学習サンプルまで作ろうとし、観測が当日 03:00 まで揃っていないので、欠けた版を置くか
    # 失敗する（どちらも 06:00 の回が置き直すまで残る）
    - cron: "40 15 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "JST の暦日（YYYY-MM-DD）。空なら前日。欠けた日を埋めるときに使う"
        required: false
        type: string

# 何も書かない。**このジョブは GITHUB_TOKEN を 1 つも使わない。**
permissions: {}

# **手で埋める回と定時の回をぶつけない。** どちらも同じパスに上書きするので壊れはしないが、
# 同時に走らせる理由が無い。待たせる（`cancel-in-progress: false`）のは、
# **始まった回を途中で捨てない**ため。
concurrency:
  group: build-features
  cancel-in-progress: false

jobs:
  build:
    name: features/ と profiles/ を作って置く
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # **ここが鍵の在り処。** `training` 環境の secrets だけがこのジョブに渡る
    environment: training
    defaults:
      run:
        working-directory: apps/ml
    steps:
      - uses: actions/checkout@v7

      # python.yml と同じ組み立て。**サードパーティのアクションに依存しない**
      - name: uv を入れる
        run: pip install --upgrade uv

      - name: Python 3.12 を用意する
        run: uv python install 3.12

      # **`--extra dev` を付けない。** 当てはめる側（lightgbm・scipy で 122 MB）は要らず、
      # 入れるのは本番と同じ依存（pyarrow・numpy・httpx・fastapi）だけでよい
      - name: 依存を入れる（uv.lock どおり、本番の依存だけ）
        run: uv sync --frozen --python 3.12

      # **入力は `env:` で渡す**（`${{ }}` をスクリプトに直接埋めない）。
      #
      # **3 回まで試す。** Supabase Storage は一過性の 504 を返すことがある
      # （2026-09-11 に手元で 1 度。60 秒でタイムアウトして返ってきた）。失敗した回も
      # `job_runs` に `failed` として残るので、**直ったことは隠れない**。
      #
      # **学習サンプルが先。** 2 つは互いに独立である——プロファイルが読まれるのは
      # **翌日**（`profile.source_day` は前日の版を返す）なので、同じ回の中の順序は
      # 依存関係ではない。**順序は「取り返しがつかない順」で決めてある**：
      #
      #   * `features/` は `weather_hourly` の **30 日**保持を過ぎると天気付きで
      #     作り直せない（W4 プラン §8.5.2）
      #   * `profiles/` は毎時 Parquet（**無期限**）から何度でも作り直せる。
      #     ただし転がしの鎖があるので、**古い日から順に**回し直す必要がある
      # **00:40 の回では作らない**（ラベルの観測が当日 03:00 まで揃わない。上の注記）。手で
      # 起動した回（`workflow_dispatch`）は `github.event.schedule` が空なので、ここを通る
      - name: 学習サンプルを作って置く
        if: github.event.schedule != '40 15 * * *'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TARGET_DATE: ${{ inputs.date }}
        run: |
          args=(--upload)
          if [ -n "${TARGET_DATE}" ]; then
            args+=(--date "${TARGET_DATE}")
          fi
          for attempt in 1 2 3; do
            if uv run python -m bikechance_ml.jobs.build_features "${args[@]}"; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "::warning::${attempt} 回目が失敗しました。120 秒待って試し直します"
              sleep 120
            fi
          done
          echo "::error::3 回とも失敗しました。job_runs の build_features を見てください"
          exit 1

      # **`always()` を付ける。** 学習サンプルが落ちてもプロファイルは試す——
      # **片方の失敗でもう片方まで落とすと、取り返す手間が 2 倍になる**。
      # どちらかが失敗すればジョブ全体は赤くなるので、気づけなくなるわけではない。
      # 00:40 の回は学習サンプルを飛ばすので、ここだけが走る。
      #
      # **定時の回は、在れば作らない**（`--skip-if-exists`）。**手で起動した回は必ず作り直す**
      # ——欠けた日を埋める・作り直すために起動するのだから、在っても置き直す。
      - name: プロファイルを作って置く
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TARGET_DATE: ${{ inputs.date }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=(--upload)
          if [ -n "${TARGET_DATE}" ]; then
            args+=(--date "${TARGET_DATE}")
          fi
          if [ "${EVENT_NAME}" = "schedule" ]; then
            args+=(--skip-if-exists)
          fi
          for attempt in 1 2 3; do
            if uv run python -m bikechance_ml.jobs.build_profiles "${args[@]}"; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "::warning::${attempt} 回目が失敗しました。120 秒待って試し直します"
              sleep 120
            fi
          done
          echo "::error::3 回とも失敗しました。job_runs の build_profiles を見てください"
          exit 1
