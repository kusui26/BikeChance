name: iOS

# apps/ios は SwiftUI のアプリと、その中の純粋ロジック（Swift Package）。
# ci.yml に混ぜないのは、macOS ランナーが要るのは iOS が変わった PR だけで、
# 収集側の PR を毎回遅くする理由が無いため（python.yml / sql-tests.yml と同じ方針）。
on:
  pull_request:
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: swift test / swift-format
    # macOS 26 が GA。iOS 26 の SDK が要る（最小 iOS バージョンが 26。開発プラン §9.1）
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: ツールチェーンを確認する
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphonesimulator --show-sdk-version

      # 判断の入るものはすべてここにある。シミュレータが要らないので速い
      - name: 純粋ロジックのテスト
        working-directory: apps/ios/BikeChanceCore
        run: swift test

      # Xcode 同梱の swift-format を使う。**追加のツールを入れない**
      - name: 書式
        working-directory: apps/ios
        run: |
          xcrun swift-format lint --strict --parallel --recursive \
            --configuration .swift-format \
            BikeChanceCore/Sources BikeChanceCore/Tests BikeChance

      # pbxproj が壊れていないことの確認。**手で書いた project.pbxproj なので効く**
      - name: アプリのビルド
        working-directory: apps/ios
        run: |
          # `shell:` を書かない run は `bash -e` で動き、pipefail が無い。無いと、xcodebuild が
          # 落ちても `| tail` の終了コード 0 で通ってしまう
          set -o pipefail
          xcodebuild -project BikeChance.xcodeproj -scheme BikeChance \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -configuration Debug build \
            CODE_SIGNING_ALLOWED=NO | tail -20

      # 配布に要る 2 つが、ビルドした .app に入っていることを確かめる（W6 の PR K、W6-33）。
      # マニフェストは置くだけで入る（同期グループ）ぶん、置き場所を動かすと黙って抜ける
      - name: プライバシーマニフェストと暗号化の申告
        working-directory: apps/ios
        run: |
          app="$(xcodebuild -project BikeChance.xcodeproj -scheme BikeChance \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' -configuration Debug \
            -showBuildSettings 2>/dev/null \
            | awk -F' = ' '$1 ~ /^ +BUILT_PRODUCTS_DIR$/ {d=$2} $1 ~ /^ +FULL_PRODUCT_NAME$/ {n=$2} END {print d "/" n}')"
          manifest="$app/PrivacyInfo.xcprivacy"
          plutil -lint "$manifest"
          test "$(plutil -extract NSPrivacyTracking raw "$manifest")" = "false"
          # 集めるのは「おおよその位置」1 種類だけ・連結なし・トラッキングなし・目的はアプリの機能
          # （W7 の W7-07、開発プランの D-43。App Store Connect のプライバシーの回答と揃える）
          test "$(plutil -extract NSPrivacyCollectedDataTypes raw "$manifest")" = "1"
          test "$(plutil -extract NSPrivacyCollectedDataTypes.0.NSPrivacyCollectedDataType raw "$manifest")" = "NSPrivacyCollectedDataTypeCoarseLocation"
          test "$(plutil -extract NSPrivacyCollectedDataTypes.0.NSPrivacyCollectedDataTypeLinked raw "$manifest")" = "false"
          test "$(plutil -extract NSPrivacyCollectedDataTypes.0.NSPrivacyCollectedDataTypeTracking raw "$manifest")" = "false"
          test "$(plutil -extract NSPrivacyCollectedDataTypes.0.NSPrivacyCollectedDataTypePurposes.0 raw "$manifest")" = "NSPrivacyCollectedDataTypePurposeAppFunctionality"
          test "$(plutil -extract ITSAppUsesNonExemptEncryption raw "$app/Info.plist")" = "false"
          # 位置の利用目的の文がある（許可を求める画面に出る。無いと許可を求められない）
          plutil -extract NSLocationWhenInUseUsageDescription raw "$app/Info.plist" | grep -q "約 1 km"
          echo "OK: マニフェスト（おおよその位置）・利用目的の文・暗号化の申告が $app に入っている"
