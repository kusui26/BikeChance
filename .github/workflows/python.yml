name: Python

# apps/ml は Vercel Services の Python サービス（W2 の PR C）。
# 既存の ci.yml に混ぜないのは、Python のセットアップが要るのは apps/ml が変わった
# PR だけで、収集側の PR を毎回遅くする理由が無いため（sql-tests.yml と同じ方針）。
# vercel.json を含めるのは、サービスの定義を変えたらここも通したいから。
on:
  pull_request:
    paths:
      - "apps/ml/**"
      - ".github/workflows/python.yml"
      - "vercel.json"

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ml:
    name: ruff / mypy / pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/ml
    steps:
      - uses: actions/checkout@v7

      # CLAUDE.md §3 の Python ツールチェーンは uv。**サードパーティのアクションに
      # 依存せず**、pip で uv を入れて uv 自身に Python を用意させる。
      # 使うアクションを checkout だけにしておくと、バージョンの当たり外れで
      # CI が壊れる面が減る。
      - name: uv を入れる
        run: pip install --upgrade uv

      - name: Python 3.12 を用意する
        run: uv python install 3.12

      # 宣言は pyproject.toml、解決結果は uv.lock。`--frozen` は「ロックを更新せず、
      # 書いてあるとおりに入れる」の意味で、**pyproject とロックが食い違ったらここで
      # 落ちる**。pyarrow は 48 MB のホイールを引くので、版が勝手に動くと Vercel の
      # 関数の大きさにも効く（PR D）
      - name: 依存を入れる（uv.lock どおり）
        run: uv sync --frozen --extra dev --python 3.12

      - name: ruff（lint）
        run: uv run ruff check .

      - name: ruff（format）
        run: uv run ruff format --check .

      - name: mypy --strict
        run: uv run mypy

      - name: pytest
        run: uv run pytest
