name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  secrets:
    name: 機密情報の混入チェック
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: トークン・鍵らしき文字列を検出
        run: |
          # 資格情報「そのものの形」を探す。ロール名 service_role のような
          # 語そのものは対象にしない（SQL の grant や Supabase の生成設定に正当に現れ、
          # 誤検知で CI が止まるため）。実際の鍵は sb_secret_ か JWT の形で現れる。
          if git grep -nIE '(acl:consumerKey=[A-Za-z0-9_-]{8}|sb_secret_[A-Za-z0-9]|eyJ[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}|gh[pousr]_[A-Za-z0-9]{20}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- . ':!*.md' ':!.github/workflows/ci.yml'; then
            echo "::error::機密情報らしき文字列が含まれています"
            exit 1
          fi
          echo "OK: 検出なし"

      - name: 応答 URL の記録を検出（W1-21）
        # ODPT はキーをクエリ acl:consumerKey でしか受け付けないため、認証付きで取得する限り
        # トークンは URL に載る（開発プラン D-04）。`res.url` / `response.url` を読むと、
        # そこからログ・例外・トレースへ漏れる経路ができる。ジョブの実装では使わせない。
        # URL の組み立てと fetch は apps/web/lib/jobs/odpt-fetch.ts の中だけで完結させる。
        # 対象は web の全コード（`/v1` を足したので `lib/jobs` と `app/api` に限定しない）。
        run: |
          # \b は macOS の git で効かないため、前後を文字クラスで表現して移植性を保つ
          if git grep -nIE '(^|[^A-Za-z0-9_$.])(res|response|resp)\.url([^A-Za-z0-9_]|$)' \
              -- 'apps/web/lib' 'apps/web/app' ':!*.test.ts'; then
            echo "::error::res.url はトークン付き URL を含み得ます。odpt-fetch.ts の外へ Response を出さないでください（W1-21）"
            exit 1
          fi
          echo "OK: 検出なし"

      - name: 外向きの fetch が指定のモジュールに閉じているか（W1-21）
        # 上の検査は res / response / resp という名前に依存するため、別名の変数はすり抜ける。
        # 本質的な不変条件は「外向きの fetch を呼ぶのは決めたモジュールだけ」で、
        # そこから Response を返さない限りトークン付き URL は外に出ない。こちらを機械で守る。
        #
        # 許すのは 2 つだけ。
        #   odpt-fetch.ts    ODPT。トークンがクエリに載る（W1-21 の封じ込め対象）
        #   weather-fetch.ts Open-Meteo。API キーが要らないため封じ込めるものは無いが、
        #                    外向きの通信を一望できる状態を保つために同じ規律に入れる
        # 3 つ目を足すときは、なぜそこから外へ出す必要があるかをこのコメントに書くこと。
        run: |
          if git grep -nIE '(^|[^A-Za-z0-9_$.])fetch\(' \
              -- 'apps/web/lib' 'apps/web/app' \
                 ':!*.test.ts' \
                 ':!apps/web/lib/jobs/odpt-fetch.ts' \
                 ':!apps/web/lib/jobs/weather-fetch.ts'; then
            echo "::error::外向きの fetch は odpt-fetch.ts / weather-fetch.ts の中だけで呼んでください（W1-21）"
            exit 1
          fi
          echo "OK: 検出なし"

      - name: バックアップ収集器が ODPT のトークンを持たないか（W3-04）
        # 冗長系のために「トークン付き URL を組み立てる箇所」を 2 つ目に作らない、という
        # 決定（W3-04）を機械で守る。バックアップ収集器は**公開エンドポイントだけ**を叩く。
        # 実測（2026-09-08）で公開エンドポイントは無認証で 200 を返し、応答は認証付きと同一。
        #
        # `api-public.odpt.org` は許し、`api.odpt.org`（認証付き）を弾く。
        run: |
          if git grep -nIE '(acl:consumerKey|(^|[^-])api\.odpt\.org|ODPT_ACCESS_TOKEN)' \
              -- 'supabase/functions'; then
            echo "::error::バックアップ収集器は ODPT の公開エンドポイントだけを使ってください（W3-04）"
            exit 1
          fi
          echo "OK: 検出なし"

      - name: バックアップ収集器の外向き fetch が index.ts に閉じているか
        # `core.ts` は純粋な部分（vitest と apps/web の tsc が見る）。通信を持ち込むと
        # 型検査もテストも届かない場所が増える。fetch は殻（index.ts）にだけ置く。
        run: |
          if git grep -nIE '(^|[^A-Za-z0-9_$.])fetch\(' \
              -- 'supabase/functions' ':!supabase/functions/*/index.ts'; then
            echo "::error::Edge Function の外向き fetch は index.ts の中だけで呼んでください"
            exit 1
          fi
          echo "OK: 検出なし"

      - name: ml サービスの外向き通信が io/ に閉じているか
        # apps/ml も同じ規律に入れる。ここは ODPT のトークンを扱わないが、
        # 「外向きの通信を一望できる状態を保つ」意味は同じで、副作用を io/ に集める
        # 規約（CLAUDE.md §3）を機械で守れる。Supabase のキーはヘッダにだけ載せる。
        run: |
          if git grep -nIE '(^|[^A-Za-z0-9_.])httpx\.' \
              -- 'apps/ml/bikechance_ml' ':!apps/ml/bikechance_ml/io'; then
            echo "::error::外向きの通信は apps/ml/bikechance_ml/io/ の中だけで行ってください"
            exit 1
          fi
          echo "OK: 検出なし"

      - name: ODPT のトークンが天気の取得に混ざっていないか
        # weather-fetch.ts を fetch の例外にしたぶん、そこにトークンが流れ込まないことを
        # 別に確かめる。Open-Meteo にキーは要らないので、参照があれば設計の誤り。
        run: |
          if git grep -nIE 'ODPT_ACCESS_TOKEN|acl:consumerKey|token' -- 'apps/web/lib/jobs/weather-fetch.ts'; then
            echo "::error::weather-fetch.ts はトークンを扱いません。設計を見直してください"
            exit 1
          fi
          echo "OK: 検出なし"

      - name: 昇格が自動化されていないか（W5 の PR M、契約 22）
        # 配信を切り替えるのは **人が確認して行う**（CLAUDE.md §6）。0038 は
        # `promote_model_version` に誰にも grant していないが、**権限が止めるのは
        # 本番で走らせた 1 回だけ**で、書いた時点では気づけない。ここで落とす。
        #
        # **禁じるのは名前ではなく「呼ぶ形」である。** jobs/infer.py と
        # jobs/fit_lightgbm.py は「配信を切り替えるのは promote_model_version() の
        # 仕事だ」と**散文で**説明していて、それは消してはいけない文である
        # （境界がどこにあるかを読む人に伝えている）。散文は括弧が空なので当たらない。
        #
        #   promote_model_version('x') / ($1)  → 当たる（引数を渡して呼んでいる）
        #   promote_model_version()            → 当たらない（散文）
        #   rpc/promote_model_version          → 当たる（REST から呼ぶ形）
        #
        # 除くのは「自分では動かない」3 つ：関数を定義する migration、権限と挙動を
        # 試す pgTAP、人が psql に打ち込む手順を書いた docs。**このファイル自身も除く**
        # ——検査の式そのものが当たってしまうため（上の「機密情報の混入チェック」が
        # 同じ理由で ci.yml を除いているのと同じ）。
        run: |
          if git grep -nIE 'promote_model_version[[:space:]]*\([[:space:]]*[^)[:space:]]|rpc/promote_model_version' \
              -- . ':!supabase/migrations' ':!supabase/tests' ':!docs' ':!.github/workflows/ci.yml'; then
            echo "::error::昇格を呼ぶ経路を作らないでください。promote_model_version は人が psql から呼びます（CLAUDE.md §6）"
            exit 1
          fi
          echo "OK: 検出なし"

      - name: 自分で走るものが昇格の名前を持たないか（W5 の PR M）
        # 呼ぶ形に化ける一歩手前で止める。人の手を介さずに走るものだけを見る。
        # apps/ml/bikechance_ml/io を入れているのは、Python から DB を叩く口が
        # そこだけだから（上の「io/ に閉じているか」と同じ境界）。
        # **このファイル自身は除く**（検査の名前そのものが当たるため）。
        run: |
          if git grep -nI 'promote_model_version' \
              -- '.github/workflows' 'scripts' 'supabase/functions' 'apps/ml/bikechance_ml/io' \
                 ':!.github/workflows/ci.yml'; then
            echo "::error::自動で走るものに昇格の名前を持たせないでください（W5 プラン §12 の 156）"
            exit 1
          fi
          echo "OK: 検出なし"

      - name: 昇格の除外が生きているか（W5 の PR M）
        # **除外そのものも検査する。** 3 つの接頭辞が呼ぶ形を持っていなければ、
        # それは「効いていない除外」で、上の 2 つは知らないうちに何も守らなくなる
        # （場所が動いた・書き方が変わった）。
        run: |
          for dir in supabase/migrations supabase/tests docs; do
            if ! git grep -qIE 'promote_model_version[[:space:]]*\([[:space:]]*[^)[:space:]]' -- "$dir"; then
              echo "::error::$dir に昇格を呼ぶ形がありません。除外が効いていない可能性があります"
              exit 1
            fi
          done
          echo "OK: 3 つとも生きている"
